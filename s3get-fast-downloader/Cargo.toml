[package]
name = "s3get"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "s3get"
path = "src/main.rs"

[dependencies]
# 禁用默认 TLS(aws-lc-rs 需 C 编译器,不利于 musl 静态),改用纯 Rust 的 rustls+ring
aws-config = { version = "1", default-features = false, features = ["rustls", "rt-tokio", "credentials-process", "sso"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rustls", "rt-tokio", "sigv4a"] }
aws-smithy-runtime = { version = "1", features = ["connector-hyper-0-14-x", "tls-rustls"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
